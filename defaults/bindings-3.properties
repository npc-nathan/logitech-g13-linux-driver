# What a G13 does out of the box.
#
# Controls are named as this project measured them off the pad, not as any other tool names them, so this file is a
# map you own: change any line, add any control, and the driver picks it up as you save.
#
# Two things this build does not need a line for: the M keys switch profile (M1/M2/M3), and MR starts a recording.
# They are built in and a line here would only take them away.
#
# **The stick is the arrow keys**, which is what the stick on every keypad is for.
JUP=p,k.103
JDOWN=p,k.108
JLEFT=p,k.105
JRIGHT=p,k.106
#
# **The first twelve G-keys are F1-F12**, which is the obvious mapping for them and useful in any game.
G1=p,k.59
G2=p,k.60
G3=p,k.61
G4=p,k.62
G5=p,k.63
G6=p,k.64
G7=p,k.65
G8=p,k.66
G9=p,k.67
G10=p,k.68
G11=p,k.87
G12=p,k.88
#
# **G13 to G22 are deliberately unmapped.** Twenty-two keys is more than any default can guess at, and ten free keys
# are worth more to you than ten someone else chose.
#
# **The two thumb buttons are the left and right mouse buttons** - they are under your thumbs and shaped like them.
LMB=mb,left
RMB=mb,right
#
# **The round button moves between screens, and holding it opens the menu.** Two things on one control, which is what
# a `.hold` line is for: the tap changes the screen, the hold opens the menu over it. Any action can be held, so this
# is not a special case - `G1.hold=m,4,1` would work exactly the same way.
LR=sv,next
LR.hold=menu
